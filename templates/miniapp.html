<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101827">
  <title>Donuz — Game Donat</title>
  <link rel="stylesheet" href="/static/miniapp.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <main class="app">
    <header class="top">
      <div class="brand"><div class="logo">D</div><div><b>DONUZ</b><small>GAME DONAT</small></div></div>
      <div class="balance"><small>DONUZ BALANS</small><strong id="balance">— so'm</strong></div>
    </header>
    <section class="intro"><span class="eyebrow">TEZKOR • QULAY • ISHONCHLI</span><h1>O‘yiningizni<br><em>to‘ldiring</em></h1><p>O‘yinni tanlang, paketni belgilang va buyurtma bering.</p></section>
    <section class="panel">
      <label for="game">1. O‘yinni tanlang</label>
      <select id="game"><option value="">O‘yin tanlang</option></select>
      <label for="package">2. Paketni tanlang</label>
      <select id="package" disabled><option value="">Avval o‘yinni tanlang</option></select>
      <div class="price-row"><span>To‘lov summasi</span><strong id="price">0 so'm</strong></div>
      <label for="playerId">3. O‘yinchi ID</label>
      <input id="playerId" type="text" inputmode="text" placeholder="ID raqamini kiriting" autocomplete="off">
      <div id="serverWrap" class="hidden"><label for="serverId">Server ID</label><input id="serverId" type="text" placeholder="Server ID"></div>
      <button id="checkBtn" class="secondary" disabled>ID ni tekshirish</button>
      <div id="checkResult" class="hint">ID tekshirilgandan keyin buyurtma berishingiz mumkin.</div>
      <button id="orderBtn" class="primary" disabled>Buyurtma berish</button>
    </section>
    <div id="notice" class="notice hidden"></div>
    <footer>Donuz Service <span>•</span> Xavfsiz to‘lov</footer>
  </main>
  <script src="/static/miniapp.js"></script>
</body>
</html>
